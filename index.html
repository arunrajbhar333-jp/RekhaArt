<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekha Art | Premium Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; }
        .product-card { background: white; border-radius: 24px; transition: all 0.3s ease; border: 1px solid #eee; }
        .product-img { aspect-ratio: 1/1; object-fit: cover; width: 100%; border-radius: 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); }
    </style>
</head>
<body class="pb-20">

    <nav class="sticky top-0 z-50 glass border-b px-5 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-black tracking-tighter">REKHA<span class="text-rose-600">ART</span></h1>
        <a href="admin.html" class="bg-gray-100 p-2 rounded-full text-gray-400"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></a>
    </nav>

    <div id="grid" class="max-w-6xl mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4">
        </div>

    <div id="payModal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm p-4 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-6 animate-in slide-in-from-bottom duration-300">
            <div id="imageSlider" class="flex overflow-x-auto snap-x no-scrollbar gap-2 mb-4 scroll-smooth"></div>
            <h2 id="mName" class="text-xl font-extrabold text-gray-900 truncate"></h2>
            <p id="mPrice" class="text-rose-600 text-3xl font-black mb-6 mt-1"></p>
            
            <div class="space-y-3">
                <button id="payBtn" class="w-full bg-black text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition">
                    PAY VIA UPI
                </button>
                <button onclick="closeModal()" class="w-full py-2 text-gray-400 font-semibold">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzV6AFO9LjDzrWnZ4Fw_Tdz32Ieif2h9MXFjavyrweUw5VM8DVQEYJhJuAx12xdJqePZw/exec";

        async function load() {
            const res = await fetch(API);
            const data = await res.json();
            const grid = document.getElementById('grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card p-3 shadow-sm active:scale-95 transition" onclick="openPay('${p.Name}', '${p.Price}', '${p.ImageURL}')">
                    <img src="${p.ImageURL.split(',')[0]}" class="product-img mb-3 bg-gray-100" loading="lazy">
                    <h3 class="font-bold text-gray-800 text-sm truncate">${p.Name}</h3>
                    <div class="flex justify-between items-center mt-1">
                        <p class="text-rose-600 font-black">₹${p.Price}</p>
                        <span class="text-[10px] bg-gray-100 px-2 py-1 rounded-full text-gray-400">${p.ID}</span>
                    </div>
                </div>
            `).join('');
        }

        function openPay(name, price, images) {
            document.getElementById('mName').innerText = name;
            document.getElementById('mPrice').innerText = "₹" + price;
            
            const slider = document.getElementById('imageSlider');
            const imgList = images.split(',');
            slider.innerHTML = imgList.map(img => `<img src="${img}" class="w-full aspect-square object-cover rounded-3xl snap-center flex-shrink-0 bg-gray-50">`).join('');
            
            document.getElementById('payBtn').onclick = () => {
                window.location.href = `upi://pay?pa=YOUR_UPI@okaxis&pn=RekhaArt&am=${price}&cu=INR`;
            };
            document.getElementById('payModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('payModal').classList.add('hidden'); }
        window.onload = load;
    </script>
</body>
</html>
